version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/api"
      - "/bot"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
